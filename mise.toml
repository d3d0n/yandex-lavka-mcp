[tools]
uv = "0.13.5"

[env]
UV_PYTHON = "3.12"
UV_MANAGED_PYTHON = "true"

[tasks.install]
description = "Install the project and test dependencies using uv-managed Python"
run = "uv sync --locked --extra test"

[tasks.test]
description = "Run the offline test suite using uv-managed Python"
run = "uv run --locked --extra test python -m pytest -q"
